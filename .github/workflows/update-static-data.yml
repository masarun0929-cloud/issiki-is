name: Update static data

on:
  workflow_dispatch:
    inputs:
      source:
        description: Request source
        required: false
        default: manual
      requested_at:
        description: Request timestamp
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: update-static-data
  cancel-in-progress: false

jobs:
  update-static-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate docs/data JSON from D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          ORIGINAL_GENRE_KEYWORDS: 一色イズ,イズ
        run: node "isshiki-izu-local-songlist/songlist_site template/tools/generate_static_data.mjs"

      - name: Commit and push static data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "isshiki-izu-local-songlist/songlist_site template/docs/data/meta.json" \
                  "isshiki-izu-local-songlist/songlist_site template/docs/data/songs.json" \
                  "isshiki-izu-local-songlist/songlist_site template/docs/data/streams.json" \
                  "isshiki-izu-local-songlist/songlist_site template/docs/data/lives.json"
          if git diff --cached --quiet; then
            echo "No static data changes."
          else
            git commit -m "Update static data"
            git push
          fi
